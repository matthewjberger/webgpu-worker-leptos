[package]
name = "renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
protocol = { path = "../protocol" }
wgpu = { version = "29", default-features = false, features = ["webgpu", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
nalgebra-glm = { version = "0.20", features = ["convert-bytemuck"] }
web-time = "1"
wasm-bindgen = "=0.2.115"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["OffscreenCanvas"] }
